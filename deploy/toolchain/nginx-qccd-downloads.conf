# /etc/nginx/snippets/qccd-downloads.conf -- included in qccd.academy's HTTPS server block,
# after qccd-official.conf.  The files live OUTSIDE the site root, because the site deploy
# (rsync --delete into /var/www/qccd.academy) would remove them.
location /downloads/ {
    alias /var/www/qccd-downloads/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
}
