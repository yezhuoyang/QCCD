# qccd.academy: the official submission service (docker compose project qccd-official).
# Installed as /etc/nginx/snippets/qccd-official.conf and included from the HTTPS server block
# of /etc/nginx/sites-available/qccd.academy:   include snippets/qccd-official.conf;
#
#   https://qccd.academy/official/v1/...  ->  http://127.0.0.1:8300/v1/...
location = /official { return 301 /official/; }
location /official/ {
    proxy_pass http://127.0.0.1:8300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;          # the service's own archive limit (MAX_ARCHIVE)
    add_header Cache-Control "no-store";
}
