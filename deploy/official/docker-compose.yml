# A LOCAL DEVELOPMENT deployment of the official submission service.
#
#   docker compose -f deploy/official/docker-compose.yml up --build
#   docker compose -f deploy/official/docker-compose.yml run --rm api \
#       python -m qccd.official.service add-uploader dev          # prints an upload token once
#   QCCD_UPLOAD_TOKEN=<token> qccd publish --approval <id> --server http://127.0.0.1:8300
#
# The API is published on 127.0.0.1 only.  There is no development bypass: uploads need a
# token created with add-uploader, and with none configured they fail closed.  Nothing here
# is a production deployment (no TLS, a fixed development database password).

name: qccd-official

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qccd
      POSTGRES_PASSWORD: qccd-dev-only
      POSTGRES_DB: qccd
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]

  api:
    build: { context: ../.., dockerfile: deploy/official/Dockerfile }
    command: ["python", "-m", "qccd.official.service", "serve", "--host", "0.0.0.0", "--port", "8300"]
    environment:
      QCCD_OFFICIAL_DB: postgresql://qccd:qccd-dev-only@db:5432/qccd
      QCCD_OFFICIAL_ARTIFACTS: /artifacts
      QCCD_ACCOUNT_SECRET: ${QCCD_ACCOUNT_SECRET:-}
    volumes: [artifacts:/artifacts]
    ports: ["127.0.0.1:8300:8300"]
    depends_on: [db]
    networks: [backend]

  worker:
    build: { context: ../.., dockerfile: deploy/official/Dockerfile }
    command: ["python", "-m", "qccd.official.worker", "worker"]
    environment:
      QCCD_OFFICIAL_DB: postgresql://qccd:qccd-dev-only@db:5432/qccd
      QCCD_OFFICIAL_ARTIFACTS: /artifacts
      QCCD_OFFICIAL_SPOOL: /spool
      # the hidden split of the Compiler board is generated by the worker, which never runs code
      QCCD_HIDDEN_SEED: ${QCCD_HIDDEN_SEED:-development-only}
    volumes: [artifacts:/artifacts:ro, spool:/spool]
    depends_on: [db]
    networks: [backend]

  # The grader holds no credentials and has no network at all; its only writable storage is
  # the spool and a tmpfs.  Bundles are data; the toolchain runs as an unprivileged user
  # under per-job time and memory limits (qccd/workspace/procs.py).
  grader:
    build: { context: ../.., dockerfile: deploy/official/Dockerfile }
    command: ["python", "-m", "qccd.official.worker", "grader", "--spool", "/spool"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    environment:
      QCCD_GRADER_MEM_MB: "12288"
      QCCD_SANDBOX_SPOOL: /sandbox
      HOME: /tmp
    volumes: [spool:/spool, sandbox:/sandbox]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 16g
    cpus: 4

  # The Compiler board runs submitted compilers HERE, never in the grader: same image, no
  # network, no secrets, nothing mounted but its own spool (qccd/bench/sandbox.py).  After each
  # request it kills everything it can signal, so nothing a compiler starts outlives its pair.
  sandbox:
    build: { context: ../.., dockerfile: deploy/official/Dockerfile }
    command: ["python", "-m", "qccd.bench.sandbox", "--spool", "/sandbox"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=1g"]
    environment:
      QCCD_SANDBOX_KILL_ALL: "1"
      HOME: /tmp
    volumes: [sandbox:/sandbox]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 8g
    cpus: 2

volumes:
  pgdata: {}
  artifacts: {}
  spool: {}
  sandbox: {}

networks:
  backend: {}
