# The website: built by `python -m qccd site`, checked, and copied to qccd.academy.
#
# Pure standard-library Python, so the build needs no install.  The check before the
# deploy is the design-tool harness on the studio page the site ships -- the same
# `tests/studio.mjs` the test suite drives -- so a page that lost its editor cannot go live.
#
# The site is static files served by nginx on the droplet at 165.232.55.161 (the host
# that also serves alphata.org) from /var/www/qccd.academy, owned by the user `qccd`.
# The deploy job rsyncs as that user over SSH; its key is the repository secret
# DEPLOY_KEY (the private half of ~/.ssh/qccd_deploy on the machine that set it up).
# Without the secret the build still runs and the deploy step says so and skips.
name: site
on:
  push:
    branches: [main, 'website/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m qccd site
      - run: node tests/studio.mjs site/studio.html | python -c "import json,sys; d=json.load(sys.stdin); assert not d.get('fatal'), d.get('fatal'); b=d.get('base', {}); assert b.get('ready', True), b.get('why'); print('studio ok:', b.get('lessons', 0), 'lessons')"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: rsync to qccd.academy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "no DEPLOY_KEY secret: build kept as the artefact, nothing deployed"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo '165.232.55.161 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAbm6u8UkEk73LltHAvr8FtqUGfT4xbzEWWe5YXoWIwK' >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" site/ qccd@165.232.55.161:/var/www/qccd.academy/
          echo "deployed to https://qccd.academy/"
