# The design-review skill (.claude/skills/qccd-design-review) carries rule references generated
# from the code: the rule sets, the boards and the grader's policy.  This fails when one of those
# changed and the references were not regenerated, so an agent never reviews a design against
# rules the repository no longer has.  The fix is one command, committed with the change:
#
#   python .claude/skills/qccd-design-review/scripts/sync_references.py --write
#
# Pure standard-library Python, like the toolchain: no install beyond pytest.
name: skills
on:
  push:
    paths:
      - 'qccd/**'
      - '.claude/skills/**'
      - 'tests/test_design_review_skill.py'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'qccd/**'
      - '.claude/skills/**'
      - 'tests/test_design_review_skill.py'
      - '.github/workflows/skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the skill's references are the rules as the code has them
        run: python .claude/skills/qccd-design-review/scripts/sync_references.py --check
      - name: the review script still judges every rule, and still fails what it should
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_design_review_skill.py
