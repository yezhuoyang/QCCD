<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
__CSSVARS__
  --fam-memory: #e8ecf6;   --fam-memory-ink: #1e2761;
  --fam-station: #e2f1ee;  --fam-station-ink: #0f766e;
  --fam-reservoir: #ecebfb; --fam-reservoir-ink: #4338ca;
  --fam-junction: #fbf1d9; --fam-junction-ink: #9a6a12;
  --fam-composite: #ffffff; --fam-composite-ink: #667085;
  --ok: #067647; --ok-soft: #dcfae6; --bad: #b42318; --bad-soft: #fee4e2; --warn-soft: #fef0c7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
/* a column: when the website injects its 40 px bar above the tool, #app takes the rest */
body { display: flex; flex-direction: column;
       font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       color: var(--ink); background: var(--bg); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 3px 9px; cursor: pointer; }
button:hover { border-color: #98a2b3; }
button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* the programs stand in columns of their own between the stage and the right-hand panels,
   from under the header to the bottom: one column a program (app.js, "the columns") */
#app { display: grid; flex: 1 1 auto; min-height: 0; position: relative;
       --left-w: var(--left-open, 250px); --right-w: var(--right-open, 340px);
       grid-template-columns: var(--left-w) minmax(0, 1fr) var(--cols-w, 0px) var(--right-w);
       grid-template-rows: 46px minmax(0, 1fr) 6px var(--tl-h, 230px);
       grid-template-areas: "head head head head" "left stage cols right" "split split cols right" "tl tl cols right"; }
#app.stack { --right-w: var(--right-open, 300px); }
#app.noleft { --left-w: 30px; }
#app.noright { --right-w: 30px; }
#app.noleft #left > .sect, #app.noright #right > .sect { display: none; }
.rail { display: none; writing-mode: vertical-rl; border: 0; border-radius: 0; background: var(--panel);
        color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
        padding: 10px 0; width: 100%; flex: 1; cursor: pointer; text-align: start; }
.rail:hover { color: var(--navy); background: var(--soft); }
#app.noleft #leftRail, #app.noright #rightRail { display: block; }
/* every boundary drags (app.js, "the widths"): a side panel's edge, a section's, a column's */
.edge { position: absolute; z-index: 7; }
.edge.e-r { right: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; }
.edge.e-l { left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; }
.edge.e-t { top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; }
.edge.e-b { bottom: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; }
.edge:hover, .edge.on, .pc-edge:hover, .pc-edge.on { background: rgba(152, 162, 179, .45); }
#app.noleft #left > .edge, #app.noright #right > .edge { display: none; }
.pc-edge { position: absolute; left: -4px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 6; }
body.dragx, body.dragx * { cursor: col-resize !important; user-select: none; }
body.dragy, body.dragy * { cursor: row-resize !important; user-select: none; }
.fold { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; }
.fold:hover { color: var(--navy); }

#cols { grid-area: cols; display: none; flex-direction: column; min-width: 0; min-height: 0; position: relative;
        background: var(--panel); border-left: 1px solid var(--line); }
#app.hascols #cols { display: flex; }
#colsBar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 5px 8px; border-bottom: 1px solid var(--line); }
#colsBar .cb-l { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
#colsBar button { font-size: 11.5px; padding: 1px 8px; }
#colsBar .cb-sp { flex: 1; }
#colsRow { flex: 1; display: flex; min-height: 0; overflow-x: auto; }
#colsRail { display: none; }
#app.nocols #colsBar, #app.nocols #colsRow { display: none; }
#app.nocols #colsRail { display: block; }
#vsplit { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 6; }
#vsplit:hover, #vsplit.on { background: rgba(152, 162, 179, .45); }
#app.nocols #vsplit { display: none; }
.pcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); position: relative; }
.pcol:last-child { border-right: 0; }
.pcol[hidden] { display: none; }
.pcol > h3 { margin: 0; padding: 6px 8px 6px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: baseline; border-bottom: 1px solid var(--line);
             white-space: nowrap; min-width: 0; }
.pcol > h3 .pc-t { color: var(--navy); }
.pcol > h3 .muted, .pcol > h3 a { text-transform: none; letter-spacing: 0; font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.pcol > h3 a { color: var(--muted); }
.pcol > .pc-b { flex: 1; min-height: 0; overflow: auto; position: relative; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; padding: 2px 0 12px; }
.cl { display: grid; grid-template-columns: 38px minmax(0, 1fr); padding-right: 8px; }
.cl .ln, .pl .ln { color: #98a2b3; text-align: right; padding-right: 8px; user-select: none; }
.cl .tx, .pl .tx { white-space: pre-wrap; overflow-wrap: anywhere; text-indent: -2ch; }
#cols.nowrap .cl .tx, #cols.nowrap .pl .tx { white-space: pre; overflow-wrap: normal; }
#cols.nowrap .pc-b > .cl, #cols.nowrap .pc-b > .pl { width: max-content; min-width: 100%; }
.cl.can { cursor: pointer; }
.cl.can:hover { background: var(--soft); }
.cl.cur { background: #fff4ed; box-shadow: inset 3px 0 var(--accent); }
.cl.abs { background: #fbf7f2; }
.cl-file { position: sticky; top: -2px; z-index: 1; background: #f3f5f8; color: var(--muted); font-family: var(--mono); font-size: 10.5px;
           padding: 2px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--soft); }
.pc-none { padding: 8px 10px; color: var(--muted); font-family: inherit; font-size: 12px; }
/* a TSIR module is tens of thousands of lines: only the rows in view are drawn, unwrapped */
.vl { position: relative; }
.vl > .vw { position: absolute; left: 0; top: 0; min-width: 100%; }
.vl .cl { height: 18px; white-space: pre; grid-template-columns: 46px max-content; }
.vl .cl .tx { white-space: pre; text-indent: 0; }

/* the words of each language (langs.js): a statement's word is a tag in its kind's colour,
   as the studio draws a hardware instruction; the same kind has the same colour in every column */
.tg { display: inline-block; text-indent: 0; padding: 0 3px; border-radius: 3px; color: #fff; font-weight: 600; line-height: 1.3; }
.t-prep { background: #0e7490; } .t-ppm { background: #4338ca; } .t-meas { background: #475467; }
.t-gate { background: #0f766e; } .t-decode { background: #7c5bfa; } .t-frame { background: #b45309; }
.t-move { background: #2563eb; } .t-cool { background: #3a9cc0; } .t-reset { background: #8792a6; } .t-run { background: #0f766e; }
.tk-kw { color: #6d28d9; font-weight: 600; } .tk-fld { color: #7c3aed; } .tk-op { color: #6d28d9; }
.tk-n { color: #b05a00; } .tk-s { color: #0b7a4b; } .tk-c { color: #8a8892; font-style: italic; }
.tk-st { color: #0e7490; font-weight: 600; } .tk-call { color: var(--navy); font-weight: 600; }
.tk-px { color: #0f766e; font-weight: 700; } .tk-pz { color: #b42318; font-weight: 700; } .tk-py { color: #7e22ce; font-weight: 700; }
.tk-gn { color: #0f766e; font-weight: 700; } .tk-mk { color: #8792a6; } .tk-val { color: #475467; }
.tk-mv { font-weight: 600; color: #4338ca; } .mv-rotate_ccw, .mv-sort_split { color: #7c5bfa; } .mv-dock { color: #b7791f; }
.mv-undock { color: #e4572e; } .mv-shuttle { color: #c2410c; } .mv-conveyor { color: #2563eb; }
[data-w] { cursor: help; }
[data-w]:hover { text-decoration: underline dotted; text-underline-offset: 2px; }
.tg[data-w]:hover { text-decoration: none; box-shadow: 0 0 0 2px rgba(24, 34, 48, .25); }

header { grid-area: head; display: flex; align-items: center; gap: 12px; padding: 0 12px;
         background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
.brand .kicker { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.brand .title { font-size: 14px; font-weight: 600; color: var(--navy); }
#crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; flex: 1; }
#crumbs a { color: var(--navy); text-decoration: none; padding: 2px 6px; border-radius: 5px; white-space: nowrap; cursor: pointer; }
#crumbs a:hover { background: var(--soft); }
#crumbs a.here { font-weight: 600; background: var(--soft); }
#crumbs .sep { color: var(--muted); }
.transport { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#clock { font-family: var(--mono); font-size: 12px; min-width: 150px; text-align: right; color: var(--ink); }
#clock small { color: var(--muted); }
#checksBadge { font-weight: 600; }
.ck .grp { grid-column: 1 / span 2; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3, #6b6b6b); padding-top: 6px; cursor: default; }
.ck .t { grid-column: 2; display: none; font-size: 11.5px; color: var(--ink2, #3f3f3f); }
.ck .t pre { font-family: var(--mono); font-size: 10.5px; white-space: pre-wrap; margin: 4px 0; background: #f7f6f2; border: 1px solid #e7e5df; border-radius: 6px; padding: 6px 8px; }
.ck.open .t { display: block; }
#traffic { flex: 0 0 auto; }
#trafficBody { padding: 2px 10px 6px; font-size: 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; line-height: 1.45; }
#trafficBody .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#trafficBody .n { white-space: nowrap; }
#trafficBody .k { color: var(--ink3, #6b6b6b); } #trafficBody .n { font-family: var(--mono); text-align: right; }
#floorView { display: none; position: fixed; inset: 6% 8%; background: #fff; border: 1px solid #d9d6cf; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); z-index: 50; flex-direction: column; }
#floorView.open { display: flex; }
#floorView .fvHead { display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid #ece9e2; font-size: 13px; }
#floorView .fvHead .muted { flex: 1; font-size: 12px; }
#floorView pre { margin: 0; padding: 12px 16px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.5; flex: 1; }
#checksBadge.ok { background: var(--ok-soft); color: var(--ok); border-color: #abefc6; }
#checksBadge.bad { background: var(--bad-soft); color: var(--bad); border-color: #fecdca; }

aside { background: var(--panel); min-height: 0; display: flex; flex-direction: column; position: relative; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); }
.sect { border-bottom: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
.sect > h3 { margin: 0; padding: 7px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.scroll { overflow: auto; min-height: 0; }

#tree { flex: 1; padding: 2px 0 8px; font-size: 12.5px; }
.tn { display: flex; align-items: center; gap: 4px; padding: 1px 8px 1px 0; cursor: pointer; white-space: nowrap; }
.tn:hover { background: var(--soft); }
.tn.sel { background: #e8ecf6; }
.tn .tw { width: 14px; text-align: center; color: var(--muted); flex: none; font-size: 10px; }
.tn .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #d0d5dd; }
.tn .dot.busy { background: var(--teal); }
.tn .nm { font-weight: 500; }
.tn .sub { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tn .blk { font-family: var(--mono); font-size: 11px; color: var(--accent); }

#checks { max-height: 34%; }
.ck { display: grid; grid-template-columns: 26px 1fr; gap: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.ck:hover { background: var(--soft); }
.ck b { font-family: var(--mono); font-size: 11px; }
.ck .v { grid-column: 2; color: var(--bad); font-size: 11.5px; display: none; }
.ck.open .v { display: block; }
.pass { color: var(--ok); } .fail { color: var(--bad); } .skip { color: var(--muted); }

#stageWrap { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--bg); container-type: inline-size; }
/* a stage narrowed by the program columns: its caption goes under the buttons, not behind them */
@container (max-width: 720px) { #stageWrap #hud { top: 44px; max-width: calc(100% - 20px); } #stageWrap #legend { display: none; } }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#hud { position: absolute; left: 10px; top: 8px; pointer-events: none; display: flex; flex-direction: column; gap: 4px; max-width: 70%; }
#hud .lvl { font-size: 15px; font-weight: 600; color: var(--navy); }
#hud .what { color: var(--muted); font-size: 12px; }
#hud .decoding { font-family: var(--mono); font-size: 11.5px; font-weight: 600; background: rgba(255,255,255,.94); border: 1.5px solid; border-radius: 6px; padding: 3px 7px; align-self: flex-start; }
#hud .step { font-family: var(--mono); font-size: 11.5px; background: rgba(255,255,255,.9); border: 1px solid var(--line);
             border-radius: 6px; padding: 3px 7px; color: var(--ink); align-self: flex-start; }
#legend { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 10px; font-size: 11.5px; color: var(--muted);
          background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; pointer-events: none; }
#legend { flex-direction: column; gap: 3px; align-items: flex-end; max-width: 72%; }
#legend .lg-cats, #legend .lg-roles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
#legend .shp { vertical-align: -2px; margin-right: 4px; }
#legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#verif { flex: 0 1 auto; max-height: 34%; }
#verifBody { padding: 2px 10px 8px; font-size: 12px; }
.so { font-weight: 600; margin: 2px 0 4px; } .so.pass { color: var(--ok); } .so.fail { color: var(--bad); }
.sol { margin: 2px 0; font-size: 12px; } .sol.pass { color: #054f31; } .sol.fail { color: var(--bad); }
.libcat { margin: 20px 0 2px; font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
#inspBody h4 .shp { vertical-align: -2px; }
#stageTools { position: absolute; right: 10px; top: 8px; display: flex; gap: 6px; }
#tip { position: fixed; pointer-events: none; background: #182230; color: #fff; font-size: 12px; padding: 5px 8px;
       border-radius: 6px; max-width: 360px; z-index: 30; display: none; white-space: pre-line; }

#insp { flex: 1 1 auto; min-height: 0; }
#inspBody { padding: 4px 10px 10px; font-size: 12.5px; }
#inspBody h4 { margin: 4px 0 2px; font-size: 14px; color: var(--navy); }
#inspBody .muted { color: var(--muted); }
#inspBody table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
#inspBody td, #inspBody th { padding: 2px 4px; text-align: left; border-bottom: 1px solid var(--soft); vertical-align: top; }
#inspBody th { color: var(--muted); font-weight: 500; font-size: 11px; }
#inspBody .num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 11.5px; }
.badge { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 9px; font-weight: 600; }
.badge.verified, .badge.certified { background: var(--ok-soft); color: var(--ok); }
.badge.modeled { background: var(--warn-soft); color: #93370d; }
.badge.failed { background: var(--bad-soft); color: var(--bad); }
.note { font-size: 11.5px; color: var(--muted); margin: 3px 0; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
a.btn { display: inline-block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; color: var(--ink); }

/* the full stack (qccd/fullstack): how a layer's line is linked to the one below, in its column's head */
.stk-how { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 9.5px; color: var(--muted); cursor: help; text-transform: none; letter-spacing: 0; }
.pl { display: grid; grid-template-columns: 38px minmax(0, 1fr); padding: 0 8px 0 0; cursor: pointer; }
.pl:hover { background: var(--soft); }
.pl.decl { color: var(--muted); }
.pl.live { background: #fff4ed; box-shadow: inset 3px 0 var(--accent); }
.pl.done { color: #475467; }
.pl.refused .ln { color: var(--bad); font-weight: 700; }
.pl.hl { background: #e8ecf6; }

#split { grid-area: split; cursor: row-resize; background: var(--line); }
#split:hover { background: #98a2b3; }
#tlWrap { grid-area: tl; position: relative; background: var(--panel); min-height: 0; }
#tl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#library { position: absolute; inset: 46px 0 0 0; background: var(--bg); z-index: 20; overflow: auto; display: none; padding: 16px 20px 40px; }
#library.open { display: block; }
#library h2 { margin: 0 0 4px; color: var(--navy); font-size: 18px; }
#library .lede { color: var(--muted); margin: 0 0 14px; max-width: 900px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card h3 { margin: 0; font-size: 15px; color: var(--navy); display: flex; justify-content: space-between; gap: 8px; }
.card .fam { font-size: 11px; color: var(--muted); font-weight: 500; }
.card .doc { color: var(--muted); margin: 2px 0 8px; font-size: 12.5px; }
.card canvas { width: 100%; height: 150px; display: block; background: var(--bg); border-radius: 6px; border: 1px solid var(--soft); }
.card table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
.card td, .card th { padding: 2px 4px; text-align: left; border-bottom: 1px solid var(--soft); }
.card th { color: var(--muted); font-weight: 500; font-size: 11px; }
.card .num { text-align: right; font-family: var(--mono); font-size: 11.5px; }

@media (max-width: 900px) {
  #app, #app.noleft, #app.noright { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46px minmax(0, 1fr) 6px 200px 320px 260px;
         grid-template-areas: "head" "stage" "split" "tl" "cols" "right"; }
  #app:not(.hascols) { grid-template-rows: 46px minmax(0, 1fr) 6px 200px 0 260px; }
  #app.nocols { grid-template-rows: 46px minmax(0, 1fr) 6px 200px 34px 260px; }
  #app.nocols #colsRail { writing-mode: horizontal-tb; }
  .pcol { min-width: 240px; }
  #vsplit, .fold, .rail, .edge, .pc-edge { display: none !important; }
  #app.noright #right > .sect { display: flex; }
  #left { display: none; }
  .brand .title, #clock small { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="kicker">QCCD · logical gadgets</span><span class="title" id="designTitle"></span></div>
    <nav id="crumbs" aria-label="hierarchy"></nav>
    <div class="transport">
      <button id="bStart" title="to the start (Home)">⏮</button>
      <button id="bPlay" title="play / pause (Space)">▶</button>
      <button id="bStep" title="next event on this level (→)">⏭</button>
      <select id="rate" title="simulated time per real second">
        <option value="200">0.2 ms/s</option><option value="2000">2 ms/s</option>
        <option value="10000" selected>10 ms/s</option><option value="50000">50 ms/s</option>
        <option value="250000">250 ms/s</option><option value="1000000">1 s/s</option>
      </select>
      <span id="clock"></span>
      <button id="bLib" title="the gadget library (L)">Library</button>
      <button id="bFloor" title="the floorplan this program runs on, as text" hidden>Floorplan</button>
      <button id="checksBadge" title="the machine's rules"></button>
    </div>
  </header>
  <aside id="left">
    <button class="rail" id="leftRail" data-hint="panel:left" title="show the hierarchy, the checks and the traffic">Hierarchy ›</button>
