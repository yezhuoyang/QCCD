# qccd.academy: the accounts and comments API, one local process (qccd-comments.service).
# Installed as /etc/nginx/snippets/qccd-api.conf and included from the HTTPS server block
# of /etc/nginx/sites-available/qccd.academy:   include snippets/qccd-api.conf;
location /api/ {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 128k;
    add_header Cache-Control "no-store";
}
