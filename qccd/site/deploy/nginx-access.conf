# qccd.academy: what is not for every visitor (qccd/site/access.py says who reads what).
#
# Installed as /etc/nginx/snippets/qccd-access.conf and included from the HTTPS server block
# of the site, BEFORE the other snippets:   include snippets/qccd-access.conf;
#
# The accounts service (qccd-comments.service, /api/authz) says who a request's cookie is.
# nginx asks it, as a subrequest, before it serves a guarded path: 2xx lets the page out,
# 401 is nobody signed in, 403 is a member who was not given this.  Anything else from the
# service (it is down, say) is a 500 to the reader: a guarded page fails closed.

location = /_authz_member {
    internal;
    proxy_pass http://127.0.0.1:8200/api/authz?need=member;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
}
location = /_authz_layers {
    internal;
    proxy_pass http://127.0.0.1:8200/api/authz?need=layers;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
}

# what a refused reader is shown, at the address they asked for (so signing in opens it there)
location = /restricted/index.html    { add_header Cache-Control "no-store" always; }
location = /restricted/no/index.html { add_header Cache-Control "no-store" always; }

# ---- for members: the 3-D stage's two files.  A visitor's page asks for them, is refused,
# and shows no 3D switch (the line after the two script tags waits for them).
location ^~ /static/3d/ {
    auth_request /_authz_member;
    add_header Cache-Control "private, no-cache" always;
}

# ---- for members: the Goal pages
location ^~ /board/goal1/ {
    auth_request /_authz_member;
    error_page 401 /restricted/index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
}
# Goal 3's point pages are stored compressed (they were served by qccd-goal3-pages.conf)
location ^~ /board/goal3/p/ {
    auth_request /_authz_member;
    error_page 401 /restricted/index.html;
    gzip_static always;
    gunzip on;
    add_header Cache-Control "private, no-store" always;
}
location ^~ /board/goal3/ {
    auth_request /_authz_member;
    error_page 401 /restricted/index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
}

# ---- the Leaderboard's index has two forms: with the Goal sections for a member, without
# them for a visitor (board/index.public.html)
location = /board/ {
    auth_request /_authz_member;
    error_page 401 = /board/index.public.html;
    try_files /board/index.html =404;
    add_header Cache-Control "private, no-store" always;
}
location = /board/index.html {
    auth_request /_authz_member;
    error_page 401 = /board/index.public.html;
    add_header Cache-Control "private, no-store" always;
}

# ---- for the readers granted `layers`: everything compiled onto a machine built in layers
location ^~ /layers/ {
    auth_request /_authz_layers;
    error_page 401 /restricted/index.html;
    error_page 403 /restricted/no/index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
}

# a board's unpublished rows have no public address: their seed files are not served by name
location ~ ^/board/[^/]+/(index\.public\.html|manifest\.public\.json)$ { return 404; }
