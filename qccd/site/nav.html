<script>
(function(){
  var ROOT = '__ROOT__', ACTIVE = '__ACTIVE__', INDEX = __INDEX__;
  var nav = document.getElementById('sitenav'), q = document.getElementById('siteq'), hits = document.getElementById('sitehits');
  if(!nav || !q || !hits) return;
  var links = nav.querySelectorAll('a[data-part]');
  for(var i = 0; i < links.length; i++) if(links[i].getAttribute('data-part') === ACTIVE) links[i].setAttribute('aria-current', 'page');
  var HITS = [], SEL = 0;
  function score(it, words){
    var hay = (it.t + ' ' + (it.d || '') + ' ' + (it.k || '')).toLowerCase(), s = 0;
    for(var w = 0; w < words.length; w++){
      var at = hay.indexOf(words[w]); if(at < 0) return 0;
      s += (it.t.toLowerCase().indexOf(words[w]) === 0 ? 3 : it.t.toLowerCase().indexOf(words[w]) >= 0 ? 2 : 1);
    }
    return s;
  }
  function render(){
    hits.innerHTML = '';
    if(!HITS.length){ hits.setAttribute('data-open', q.value.trim() ? '1' : '0');
      if(q.value.trim()){ var d = document.createElement('div'); d.className = 'sn-none'; d.textContent = 'nothing matches'; hits.appendChild(d); } return; }
    HITS.forEach(function(it, i){
      var a = document.createElement('a'); a.href = ROOT + it.u; a.setAttribute('data-sel', i === SEL ? '1' : '0');
      var k = document.createElement('span'); k.className = 'sn-k'; k.textContent = it.k || '';
      var b = document.createElement('b'); b.textContent = it.t;
      var s = document.createElement('small'); s.textContent = it.d || '';
      a.appendChild(k); a.appendChild(b); a.appendChild(s); hits.appendChild(a);
    });
    hits.setAttribute('data-open', '1');
  }
  function search(){
    var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    HITS = []; SEL = 0;
    if(words.length){
      HITS = INDEX.map(function(it){ return [score(it, words), it]; }).filter(function(p){ return p[0] > 0; })
        .sort(function(a, b){ return b[0] - a[0]; }).slice(0, 12).map(function(p){ return p[1]; });
    }
    render();
  }
  // the same document with another hash is a fragment navigation: no reload, `hashchange` fires
  function open(it){ if(it) location.href = ROOT + it.u; }
  q.addEventListener('input', search);
  q.addEventListener('focus', function(){ if(q.value) search(); });
  q.addEventListener('keydown', function(ev){
    if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){ ev.preventDefault(); if(!HITS.length) return;
      SEL = (SEL + (ev.key === 'ArrowDown' ? 1 : HITS.length - 1)) % HITS.length; render(); }
    else if(ev.key === 'Enter'){ ev.preventDefault(); open(HITS[SEL]); }
    else if(ev.key === 'Escape'){ q.value = ''; HITS = []; render(); q.blur(); }
  });
  document.addEventListener('click', function(ev){ if(!hits.contains(ev.target) && ev.target !== q){ hits.setAttribute('data-open', '0'); } });
  // Ctrl+K reaches this box on pages that have no search of their own; the studio keeps its own
  if(!document.getElementById('search')){
    document.addEventListener('keydown', function(ev){ if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); q.focus(); q.select(); } });
  }
  window.SITENAV = { search: function(s){ q.value = s; search(); return HITS.slice(); }, index: INDEX };
})();
</script>
<!-- qccd-agent: the Agent button, on every page.  It opens THIS page from the person's own
     computer (the workspace's website, qccd/workspace/mirror.py, on its well-known port
     47100), where a chat reaches their local agent.  It is a plain link: this site never
     connects to their computer.  A page with its own agent panel (studio.html, cowork.py)
     keeps that one. -->
<style>
#qa-btn{font:inherit;font-size:13px;margin:0 6px 0 4px;padding:4px 11px 4px 9px;border:1px solid #bcd4f2;
 border-radius:99px;background:#eef4fc;color:#1d4f91;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
 white-space:nowrap}
#qa-btn:hover{background:#e2edfb;border-color:#9dbfe9}
#qa-btn[aria-expanded="true"]{background:#2a78d6;border-color:#2a78d6;color:#fff}
#qa-btn i{width:7px;height:7px;border-radius:50%;background:#2a78d6;display:inline-block}
#qa-btn[aria-expanded="true"] i{background:#fff}
#qa-panel{position:fixed;top:48px;right:12px;width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 62px);
 overflow:auto;background:#fff;border:1px solid #cfceca;border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.18);
 z-index:1100;display:none;padding:16px 18px 14px;color:#1d1d1b;
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#qa-panel[data-open="1"]{display:block}
#qa-panel h2{font-size:17px;margin:0 28px 6px 0;line-height:1.3}

#qa-panel code{padding:1px 4px}
#qa-panel pre{padding:7px 9px;margin:4px 0 8px;white-space:pre-wrap;word-break:break-word;user-select:all}
#qa-panel .qa-small{font-size:12.5px;color:#52514e}
#qa-panel .qa-x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:#6b6a66;padding:4px}
#qa-panel .qa-go{display:inline-block;margin:6px 8px 4px 0;padding:8px 14px;border-radius:7px;background:#2a78d6;color:#fff;
 font-weight:600;text-decoration:none;border:1px solid #2a78d6}
#qa-panel .qa-go:hover{background:#1f66bd}
#qa-panel .qa-go.alt{background:#fff;color:#1d4f91;border-color:#bcd4f2}
#qa-panel .qa-go.alt:hover{background:#eef4fc}
</style>
<script>
(function(){
  if(window.self !== window.top) return;                  // an example embedded in another page
  if(/(^|[#&])embed(&|$)/.test(location.hash)) return;
  var PORT = 47100;                                        // qccd/workspace/mirror.py WEB_PORT
  var PANEL = '<button class="qa-x" type="button" aria-label="close">&times;</button>'
    + '<h2>Ask your own agent about this page</h2>'
    + '<p>An AI agent on your computer (Codex or Claude Code) can read this page with you. Ask about '
    + 'it, and the agent points at the answer on the page, steps the examples, opens lessons and takes '
    + 'you to other pages. It can also change your own design and run programs on it.</p>'
    + '<p><a class="qa-go" data-go="page" target="_blank" rel="noopener">Open this page with my agent</a>'
    + '<a class="qa-go alt" data-go="studio" target="_blank" rel="noopener">Open my Studio</a></p>'
    + '<p class="qa-small">This opens the same page from your own computer (127.0.0.1), with a chat to '
    + 'your agent. It works while your workspace is running. This website does not connect to your '
    + 'computer: the button is only a link.</p>'
    + '<h3>Not running, or not set up yet?</h3>'
    + '<p>If the page does not open, start your workspace: in its folder, run <code>qccd web</code>. That '
    + 'also connects this browser to it. The first time, set up once:</p>'
    + '<pre>git clone -b compiler https://github.com/yezhuoyang/QCCD\ncd QCCD\npython -m venv .venv\n'
    + '.venv\\Scripts\\activate\npip install -e ".[agent]"\nqccd toolchain install\ncd ..\n'
    + 'qccd init my-design --task ghz4@1\ncd my-design\nqccd agent install --client codex\nqccd web</pre>'
    + '<p class="qa-small">On macOS or Linux, activate with <code>source .venv/bin/activate</code>. Codex '
    + 'starts by itself when you send your first message. For Claude Code, run <code>qccd agent install '
    + '--client claude</code> instead. After an update (<code>git pull</code>), run <code>qccd stop</code>, '
    + 'then <code>qccd web</code> again. '
    + '<a href="https://github.com/yezhuoyang/QCCD/blob/compiler/docs/workspace.md">How it works</a></p>';
  function start(){
    var nav = document.getElementById('sitenav');
    if(!nav || document.getElementById('qa-btn')) return;   // this page has its own agent panel
    var brand = nav.querySelector('.sn-brand'), root;
    try { root = new URL(brand ? brand.getAttribute('href') : '/', location.href); } catch(e){ return; }
    // this page, relative to the site's root; the query string stays here (an ?invite= token must not travel)
    var rel = location.pathname.indexOf(root.pathname) === 0 ? location.pathname.slice(root.pathname.length)
                                                              : location.pathname.replace(/^\//, '');
    var local = 'http://127.0.0.1:' + PORT;
    var btn = document.createElement('button');
    btn.id = 'qa-btn'; btn.type = 'button'; btn.setAttribute('aria-expanded', 'false');
    btn.title = 'Ask your own AI agent (Codex or Claude Code) about this page';
    btn.innerHTML = '<i></i>Agent';
    nav.insertBefore(btn, nav.querySelector('.sn-sp'));
    var panel = document.createElement('div');
    panel.id = 'qa-panel'; panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', 'Ask your own agent');
    panel.setAttribute('data-open', '0');
    panel.innerHTML = PANEL;
    panel.querySelector('[data-go="page"]').href = local + '/web/' + rel + location.hash;
    panel.querySelector('[data-go="studio"]').href = local + '/studio';
    document.body.appendChild(panel);
    function open(v){ panel.setAttribute('data-open', v ? '1' : '0'); btn.setAttribute('aria-expanded', v ? 'true' : 'false'); }
    btn.addEventListener('click', function(){ open(panel.getAttribute('data-open') !== '1'); });
    panel.querySelector('.qa-x').addEventListener('click', function(){ open(false); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') open(false); });
    window.addEventListener('hashchange', function(){ panel.querySelector('[data-go="page"]').href = local + '/web/' + rel + location.hash; });
    if(/(^|[?&])agent(=|&|$)/.test(location.search.slice(1))) open(true);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
